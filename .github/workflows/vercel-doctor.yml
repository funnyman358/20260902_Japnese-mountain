name: Vercel Doctor

on:
  workflow_dispatch:

jobs:
  doctor:
    name: Vercel の状態を調べる
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT_NAME: yamacomp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g vercel@latest

      - name: プロジェクトにリンク
        run: vercel link --yes --project "$PROJECT_NAME" --token="$VERCEL_TOKEN"

      - name: デプロイ一覧
        run: vercel ls "$PROJECT_NAME" --token="$VERCEL_TOKEN" || true

      - name: 現在の本番URLを各パスで確認
        run: |
          base="https://${PROJECT_NAME}-arigatou358358358-9171s-projects.vercel.app"
          for path in "/" "/mountains" "/icon.svg" "/manifest.webmanifest"; do
            echo "=== $base$path"
            curl -s -o /dev/null -D - -w "" "$base$path" | grep -Ei "^(HTTP|x-vercel|content-type|location)" || true
          done

      - name: prebuilt 方式で再デプロイ
        id: prebuilt
        run: |
          set -o pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          echo "--- .vercel/project.json ---"
          cat .vercel/project.json || true
          vercel build --prod --token="$VERCEL_TOKEN"
          echo "--- ビルド成果物 ---"
          ls -la .vercel/output || true
          echo "--- config.json ---"
          cat .vercel/output/config.json || true
          echo "--- static 直下 ---"
          ls .vercel/output/static | head -20 || true
          url=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" | tail -n 1)
          echo "PREBUILT_URL=$url" >> "$GITHUB_ENV"
          echo "新URL: $url"

      - name: 再デプロイ後の応答
        run: |
          for path in "/" "/mountains"; do
            echo "=== ${PREBUILT_URL}${path}"
            curl -s -o /tmp/b.html -D - -w "" "${PREBUILT_URL}${path}" | grep -Ei "^(HTTP|x-vercel|content-type)" || true
            head -c 200 /tmp/b.html; echo
          done
          echo "=== 固定URL"
          curl -s -o /dev/null -w "%{http_code}\n" "https://${PROJECT_NAME}-arigatou358358358-9171s-projects.vercel.app/"
