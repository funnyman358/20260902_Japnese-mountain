name: Check & Deploy

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 検証（データ・型・Lint・ビルド）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 山データの整合性チェック
        run: npm run validate
      - name: 型チェック
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: 本番ビルド
        run: npm run build

  deploy:
    name: Vercel へデプロイ
    needs: check
    runs-on: ubuntu-latest
    env:
      # シークレット未設定でもワークフローが赤くならないよう、有無で分岐する
      HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: 設定状況の確認
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            {
              echo "## Vercel デプロイはスキップしました"
              echo ""
              echo "リポジトリの **Settings → Secrets and variables → Actions** に次を登録すると、"
              echo "以降の push で自動デプロイされます。"
              echo ""
              echo "| シークレット | 必須 | 取得場所 |"
              echo "| --- | --- | --- |"
              echo "| \`VERCEL_TOKEN\` | 必須 | https://vercel.com/account/tokens |"
              echo "| \`VERCEL_ORG_ID\` | 任意 | 既存プロジェクトに紐付ける場合のみ（Vercel の Project Settings） |"
              echo "| \`VERCEL_PROJECT_ID\` | 任意 | 同上。未設定なら新規プロジェクトが自動作成されます |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22

      - name: Vercel CLI を導入
        if: env.HAS_TOKEN == 'true'
        run: npm i -g vercel@latest

      - name: 本番環境へデプロイ
        if: env.HAS_TOKEN == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Vercel のプロジェクト名は小文字のみ。リポジトリ名から自動生成すると
          # 大文字が含まれて弾かれるため、明示的に指定する。
          PROJECT_NAME: yamacomp
        run: |
          set -o pipefail
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            # 既に存在する場合はエラーになるので無視して先へ進む
            vercel project add "$PROJECT_NAME" --token="$VERCEL_TOKEN" || true
            vercel link --yes --project "$PROJECT_NAME" --token="$VERCEL_TOKEN"
          fi
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" | tail -n 1)
          echo "デプロイ先: $url"
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"

      - name: 公開状態を確認
        if: env.HAS_TOKEN == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_NAME: yamacomp
        run: |
          # 反映に少し時間がかかることがあるのでリトライしながら確認する
          check() {
            local target="$1"
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /tmp/body.html -w "%{http_code}" -D /tmp/head.txt "$target" || echo ERR)
              if [ "$code" = "200" ]; then
                echo "OK   $code  $target"
                return 0
              fi
              sleep 10
            done
            echo "NG   $code  $target"
            echo "--- 応答ヘッダー ---"
            cat /tmp/head.txt || true
            echo "--- 本文の先頭 ---"
            head -c 400 /tmp/body.html || true
            echo
            return 1
          }

          stable="https://${PROJECT_NAME}-arigatou358358358-9171s-projects.vercel.app"
          ok=0
          check "$DEPLOY_URL" || ok=1
          check "$stable" || ok=1

          # 参考: 同じアカウントの既存プロジェクトが見えているかも確認する
          echo "参考: $(curl -s -o /dev/null -w '%{http_code}' https://japan-extremes.vercel.app)  https://japan-extremes.vercel.app"

          {
            echo "## デプロイ完了 🎉"
            echo ""
            echo "- デプロイURL: $DEPLOY_URL"
            echo "- 固定URL: $stable"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $ok
